# Loads default set of integrations. Do not remove.
default_config:

# Allows local Nginx Proxy Manager
# 2FA enabled already too
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.17.0.0/24
  ip_ban_enabled: true
  login_attempts_threshold: 5

# Text to speech
tts:
  - platform: google_translate

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
sensor: !include sensors.yaml

# APRS tracker devices
device_tracker:
  - platform: aprs
    username: ZS1OSS  # or FO0BAR-1 to FO0BAR-15
    callsigns:
      - 'ZS1OSS*'
      - 'ZS1DCC-1'

# Enable backups
backup:

modbus: !include modbus.yaml
#monitor_docker: !include monitor_docker.yaml

# Load OurGroceries app API
#ourgroceries:
#  username: !secret our_groceries_username
#  password: !secret our_groceries_password
  

# Uncomment below to generate debug logging
logger:
  default: warning
  # default: critical
  #logs:
    # Modbus debug lines
    #homeassistant.components.modbus: debug
    #pymodbus: debug
    # Glances debug lines
    #homeassistant.components.glances: debug
    #glances_api: debug
    #aiohttp: debug

# Exports to InfluxDB for Grafana display of graphs etc
influxdb:
  api_version: 2
  ssl: false
  host: localhost
  port: 8086
  token: !secret influxdb_token
  organization: 74fa36561df3a7c0
  bucket: Home Assistant
  max_retries: 5
  precision: ms
  measurement_attr: unit_of_measurement
  
# Create custom sensor to output conversion as total potential max of forecast for panel area
# Panel is 330W max for 1.94628m2 (8 panels = 15.57 m2 and 2,640 W max)
# Efficiency of panel is 16.97% (Scale of 0.1697 of forecast as their potential maximum)
# Weather station actual measured radiation 'sensor.thornton_solar_rad' is W/m2 (ignores efficiency of panels)
# Total (W) = W/m2 * panel area * efficiency

template:
- sensor:
  - name: AC Loads Custom
    default_entity_id: sensor.custom_ac_loads
    state: >-
      {{ states('sensor.ac_loads') | int }}
      unit_of_measurement: "W"
      # Change value in this line below for the icon change threshold
    icon: >-
      {% if int(states('sensor.ac_loads')) >= 600 %}
        mdi:alert
      {%- else -%}
        mdi:power-socket-fr
      {%- endif %}
  - name: Monthly Grid Cost
    default_entity_id: sensor.monthly_grid_cost
    state: >-
      {{ (states('sensor.sonoff_10023a625a_energy_month') | float * 3.44) | round(2) }}
    unit_of_measurement: "R"
  - name: Forecasted solar radiation W/m2 converted to Total
    default_entity_id: sensor.radiation_converted
    unit_of_measurement: "W"
    icon: mdi:sun-wireless
    device_class: power
    state: >-
      {{ states('sensor.thornton_solar_rad')|int * 15.57 * 0.1697}}
          
  # Calculate hours left to empty based on battery_max_capacity at 100% charge
  # UPDATE MAY 2023: Empty is actually 11% SOC so adjusted formula to reach 11% instead of 0%
  # Hours left = (SOC%-11) * battery_max_capacity (Ah) divided by Current in Amps eg. 86% at 11 Amps is (0.86*206)/11
  # Condition 1 to check battery is discharging (current in Amps will be negative number), then use ABS of battery_current to make
  # negative current flow, a positive float number. Set this to -1 Amp (50W at 52V) instead of 0 Amps to prevent very small
  # discharges when full, from projecting extremely long hours on gauge
  # Condition 2 to check if battery current is zero or charging, then calculate time left based on ac load
  # (AC Watts converted to DC Amps current - because AC Watts = DC Watts)
  # Had to convert all to floats for precision of partial hours, then rounded to 2 decimals
  - name: Time left on Battery to Empty
    default_entity_id: sensor.time_left_on_battery_zero
    unit_of_measurement: "Hours"
    icon: mdi:sort-clock-ascending-outline
    state: >-
        {% set battery_current = states('sensor.battery_current')|float %}
        {% set battery_soc = states('sensor.battery_soc')|float %}
        {% set loads_current = states('sensor.ac_loads')|float/states('sensor.battery_voltage')|float %}
        {% set battery_max_capacity = states('sensor.solar_battery_maximum_capacity')|float %}
        {{ ((((battery_soc-11)*battery_max_capacity)/100)/loads_current|float ) | round(2) }}
          

  # Calculate hours left to current min SOC based on battery_max_capacity at 100% charge, ie. when it reverts back to grid power
  # Hours left = (SOC%-MinSOC) * battery_max_capacity (Ah) divided by Current in Amps eg. 86%-40% at 11 Amps is (0.46*206)/11
  # Condition 1 to check if SoC has not already reached MinSOC or below it, as then time to reach MinSOC has reached 0 hours, so make 0
  # Condition 2 to check battery is discharging (current in Amps will be negative number), then use ABS of battery_current to make
  # negative current flow, a positive float number.  Set this to -1 Amp (50W at 52V) instead of 0 Amps to prevent very small discharges
  # when full, from projecting extremely long hours on gauge
  # Condition 3 to check if battery current is zero or charging, then calculate time left based on ac load (AC Watts converted to
  # DC Amps current - because AC Watts = DC Watts) 
  # Had to convert all to floats for precision of partial hours, then rounded to 2 decimals
  - name: Time left on Battery to Min SoC
    default_entity_id: sensor.time_left_on_battery_min_soc
    unit_of_measurement: "Hours"
    icon: mdi:sort-clock-ascending
    state: >-
      {% set battery_current = states('sensor.battery_current')|float %}
      {% set battery_soc = states('sensor.battery_soc')|float %}
      {% set loads_current = states('sensor.ac_loads')|float/states('sensor.battery_voltage')|float %}
      {% set battery_min_soc = states('sensor.victron_battery_min_soc')|float %}
      {% set battery_max_capacity = states('sensor.solar_battery_maximum_capacity')|float %}
      {% if (battery_soc-battery_min_soc) < 0 %}
        {{ 0 }}
      {% else %}
        {{ ((((battery_soc-battery_min_soc)*battery_max_capacity)/100)/loads_current | float ) | round(2) }}
      {% endif %}
    
  # This calculates the difference in whole days since the solar battery was last fully charged. It calculates based on the
  # value of the Helper called Battery Last Full Date's state. There is an Automation that triggers a reset of the Helper
  # when SOC is 100% and the battery current has changed from Charging to Idle. Less than a day will output 0.
  - default_entity_id: sensor.battery_last_full_days
    unit_of_measurement: "Hours"
    icon: mdi:battery-charging-100
    state: >-
      {% set battery_last_full_date = as_timestamp(states.input_datetime.battery_last_full_date.state)|int %}
      {% set now_full_date = as_timestamp(now())|int %}
      {{ ((now_full_date - battery_last_full_date)/86400) | int }}
  # Convert raw imperial measurements from weather station into metric readings
  - name: Wind Speed
    default_entity_id: sensor.ambientweather_wind_kmh
    unit_of_measurement: "km/h"
    icon: mdi:weather-windy
    state: >-
      {{(states('sensor.thornton_wind_speed')|int*1.609) | int}}
  - name: Wind Gust
    default_entity_id: sensor.ambientweather_wind_gust_kmh
    unit_of_measurement: "km/h"
    icon: mdi:weather-windy
    state: >-
      {{(states('sensor.thornton_wind_gust')|int*1.609) | int}}
  - name: Max Gust
    default_entity_id: sensor.ambientweather_max_gust_kmh
    unit_of_measurement: "km/h"
    icon: mdi:weather-windy
    state: >-
      {{(states('sensor.thornton_max_gust')|int*1.609) | int}}
  - name: Rain Today
    default_entity_id: sensor.ambientweather_daily_rain_mm
    unit_of_measurement: "mm"
    icon: mdi:weather-rainy
    state: >-
      {{(states('sensor.thornton_daily_rain')|int*25.4) | int}}
  - name: Rain Event
    default_entity_id: sensor.ambientweather_event_rain_mm
    unit_of_measurement: "mm"
    icon: mdi:weather-rainy
    state: >-
      {{(states('sensor.thornton_event_rain')|int*25.4) | int}}

        
