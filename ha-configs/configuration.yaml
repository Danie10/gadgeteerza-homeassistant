# Loads default set of integrations. Do not remove.
default_config:

recorder:
  commit_interval: 30       # Batches writes every 30s instead of 5s
  purge_keep_days: 7        # Reduces DB size on the RAID
  exclude:
    domains:
      - automation
      - updater
    entity_globs:
      - sensor.sun*
      - sensor.uptime*
    entities:
      - sensor.date_time     # This writes every single minute!
      - sensor.ac_loads      # If this is extremely noisy, consider excluding

# Text to speech
tts:
  - platform: google_translate

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
sensor: !include sensors.yaml

# APRS tracker devices
device_tracker:
  - platform: aprs
    username: ZS1OSS  # or FO0BAR-1 to FO0BAR-15
    callsigns:
      - 'ZS1OSS*'
      - 'ZS1DCC-1'

# Enable backups
backup:

modbus: !include modbus.yaml
#monitor_docker: !include monitor_docker.yaml

